<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://apis.google.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self';
        connect-src 'self' ws: wss: https://*.googleapis.com https://*.firebaseio.com https://accounts.google.com;
        object-src 'none';
        frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://apis.google.com;
        base-uri 'self';
        form-action 'self';
      "
    />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="PlayPath Melbourne connects residents with community sport, walking and active travel activities."
    />

    <meta
      name="theme-color"
      content="#25213b"
    />

    <link
      rel="icon"
      href="/favicon.ico"
    />

    <title>
      PlayPath Melbourne | Community Sport and Active
      Travel
    </title>
  </head>

  <body>
    <noscript>
      PlayPath Melbourne requires JavaScript to run.
    </noscript>

    <div id="app"></div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
