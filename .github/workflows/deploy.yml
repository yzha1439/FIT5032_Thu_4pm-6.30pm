name: Deploy to GitHub Pages

on: [push]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: week12/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: week12

      - name: Build
        run: npm run build
        working-directory: week12

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: week12/dist